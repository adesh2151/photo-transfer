name: Build apps

# Builds the double-click standalone app for Windows, macOS and Linux and
# attaches them to a Release on every pushed tag (e.g. v1.0.0). Can also be run
# by hand from the Actions tab.
#
# macOS: built as a UNIVERSAL2 binary (runs on both Intel and Apple Silicon) —
#   one download for all Macs.
# Linux: built inside an old Ubuntu (20.04) container so the binary links against
#   an old glibc and runs on older Linux too.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- Windows & macOS -----------------------------------------------------
  desktop:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PhotoTransfer-windows.zip
          - os: macos-14          # Apple Silicon runner; builds a universal2 app
            asset: PhotoTransfer-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip segno pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onedir --windowed --name PhotoTransfer --hidden-import segno app.py
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --onedir --windowed --target-arch universal2 --name PhotoTransfer --hidden-import segno app.py

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "PhotoTransfer.app" ]; then zip -r -q "../${{ matrix.asset }}" "PhotoTransfer.app";
          else zip -r -q "../${{ matrix.asset }}" "PhotoTransfer"; fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/PhotoTransfer -DestinationPath ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  # ---- Linux (built on old glibc for wide compatibility) -------------------
  linux:
    name: Build on Linux (glibc 2.31)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3 python3-pip python3-dev zip binutils ca-certificates
      - uses: actions/checkout@v4
      - run: python3 -m pip install --upgrade pip segno pyinstaller
      - run: python3 -m PyInstaller --noconfirm --onedir --name PhotoTransfer --hidden-import segno app.py
      - name: Package
        run: |
          cd dist
          zip -r -q "../PhotoTransfer-linux.zip" "PhotoTransfer"
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoTransfer-linux.zip
          path: PhotoTransfer-linux.zip
      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoTransfer-linux.zip
